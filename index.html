<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/architect-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#071319" />
    <meta
      name="description"
      content="THE ARCHITECT — a private commitment execution and record system. Plan, execute, record, repeat."
    />
    <title>THE ARCHITECT</title>
    <script>
      // Early-paint theme hint only (never the source of truth). Blueprint §D, §Q.
      (function () {
        try {
          var stored = localStorage.getItem("architect.theme");
          var pref = stored === "LIGHT" || stored === "DARK" || stored === "SYSTEM" ? stored : "SYSTEM";
          var resolved =
            pref === "SYSTEM"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : pref.toLowerCase();
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          /* noncritical */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
